name: PyQt6 desktop builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --windowed --name SmartToolbox --collect-all qrcode main.py
      - if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --name SmartToolbox --collect-all qrcode main.py
      - if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean --name SmartToolbox --collect-all qrcode main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SmartToolbox-${{ matrix.target }}
          path: desktop/dist/
